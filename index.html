function bind(){
document.querySelectorAll("[data-pin]").forEach(b=>b.addEventListener("click",()=>{const n=b.dataset.pin;if(n==="⌫")state.pin=state.pin.slice(0,-1);else if(state.pin.length<4)state.pin+=n;if(state.pin==="1607"){state.unlocked=true;state.pin="";state.page="home";toast("iPhone entsperrt");}render();}));
document.querySelectorAll("[data-action='app']").forEach(b=>b.addEventListener("click",()=>openPage(b.dataset.id)));
document.querySelectorAll("[data-action='home']").forEach(b=>b.addEventListener("click",()=>openPage("home")));
document.querySelectorAll("[data-action='chat']").forEach(b=>b.addEventListener("click",()=>{state.page="chat:"+b.dataset.id;render();}));
document.querySelectorAll("[data-action='photo']").forEach(b=>b.addEventListener("click",()=>showPhoto(b.dataset.id)));
document.querySelectorAll("[data-action='contact']").forEach(b=>b.addEventListener("click",()=>showContact(b.dataset.id)));
document.querySelectorAll("[data-action='mail']").forEach(b=>b.addEventListener("click",()=>showMail(b.dataset.id)));
document.querySelectorAll("[data-action='calendar']").forEach(b=>b.addEventListener("click",()=>showCalendar(b.dataset.id)));
const form=document.getElementById("burcuForm");if(form)form.addEventListener("submit",e=>{e.preventDefault();const val=document.getElementById("burcuInput").value.trim();if(val)handleBurcuText(val);});
const gs=document.getElementById("globalSearch");if(gs)gs.addEventListener("input",()=>searchResults(gs.value));
const cs=document.getElementById("contactSearch");if(cs)cs.addEventListener("input",()=>{const q=cs.value.toLowerCase();document.querySelectorAll("[data-action='contact']").forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?"":"none");});
const ws=document.getElementById("waSearch");if(ws)ws.addEventListener("input",()=>{const q=ws.value.toLowerCase();document.querySelectorAll("[data-action='chat']").forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?"":"none");});
}
function render(){
if(!state.unlocked){view.innerHTML=lock();bind();return;}
if(state.page==="home"){view.innerHTML=home();bind();return;}
let content;switch(state.page){
case"wa":content=wa();break;case"gallery":content=gallery();break;case"contacts":content=contacts();break;case"phone":content=phone();break;case"mail":content=mail();break;case"calendar":content=calendar();break;case"maps":content=maps();break;case"instagram":content=instagram();break;case"notes":content=notes();break;case"files":content=files();break;case"camera":content=camera();break;case"music":content=music();break;case"weather":content=weather();break;case"clock":content=clockPage();break;case"settings":content=settings();break;case"search":content=search();break;case"reminders":content=reminders();break;case"safari":content=safari();break;case"voice":content=voice();break;case"health":content=health();break;case"wallet":content=wallet();break;case"translate":content=translate();break;default:content=home();}
view.innerHTML=content;bind();}

render();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
